<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla koppeling</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>Tesla koppeling</h2><p id="m">Geen code gevonden.</p>
<script>var p=new URLSearchParams(location.search);var c=p.get('code');if(c){document.getElementById('m').innerHTML='Gelukt! Kopieer deze code en stuur hem naar Bot:<br><br><b style="word-break:break-all">'+c.replace(/[<>&"]/g,'')+'</b>';}else if(p.get('error')){document.getElementById('m').textContent='Fout: '+p.get('error');}</script>
</body></html>
